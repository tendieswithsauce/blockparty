# Checks every pull request (and every push to dev): typecheck, lint, build.
# Make "CI / check" a required status check on main so nothing reaches the
# live site without passing.
name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the build needs these to exist, not to be real. No
      # secrets are used in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        # Route types (PageProps etc.) are generated, not committed.
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npx next build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
