# Weekly pull requests for outdated or vulnerable dependencies, into dev
# (so they're tested on the preview before release). Minor and patch
# updates are grouped into one PR to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades we take on purpose, not from a weekly bot:
    # - typescript: 7 (the native compiler) fails our build as of 2026-11.
    # - @types/node: must match the Node version the site runs on (24, the
    #   same as CI's setup-node), not the newest Node.
    # Minor and patch updates for both still come through.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
