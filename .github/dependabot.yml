# Weekly pull requests for outdated or vulnerable dependencies, into dev
# (so they're tested on the preview before release). Minor and patch
# updates are grouped into one PR to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
